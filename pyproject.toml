[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-sentinel"
version = "0.1.0"
description = "Asynchronous FastAPI/ASGI middleware for real-time OpenAPI schema drift detection and dynamic schema inference"
readme = "README.md"
authors = [{ name = "API Sentinel Team" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.95.0",
    "starlette>=0.26.0",
    "genson>=1.2.2",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pydantic>=1.10.0",
    "uvicorn>=0.20.0"
]
requires-python = ">=3.10"

[tool.pyright]
venvPath = "."
venv = ".venv"

